<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Deniz Cankirli</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Inter, Arial, sans-serif;
}

body{
  background:#05070c;
  color:white;
  overflow-x:hidden;
}

/* HERO */
.hero{
  height:100vh;
  position:relative;
  background:url("hero.jpg") center/cover no-repeat;
}

/* dark cinematic overlay */
.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,
    rgba(0,0,0,0.35),
    rgba(0,0,0,0.75)
  );
}

/* TOP LEFT NAME */
.topbar{
  position:absolute;
  top:25px;
  left:30px;
  z-index:2;
  font-size:14px;
  letter-spacing:2px;
  text-transform:lowercase;
  opacity:0.9;
}

/* CENTER CONTENT */
.center{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:2;
  text-align:center;
}

h1{
  font-size:5.5rem;
  letter-spacing:2px;
  font-weight:800;
}

.sub{
  margin-top:15px;
  font-size:1.1rem;
  opacity:0.7;
}

/* subtle bottom hint */
.scroll{
  position:absolute;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  font-size:12px;
  opacity:0.5;
  letter-spacing:2px;
  z-index:2;
}

</style>
</head>

<body>

<div class="hero">

  <!-- TOP LEFT SMALL NAME -->
  <div class="topbar">deniz cankirli</div>

  <!-- CENTER BIG NAME -->
  <div class="center">
    <div>
      <h1>DENIZ CANKIRLI</h1>
      <div class="sub">Lifestyle • Focus • Freedom</div>
    </div>
  </div>

  <div class="scroll">SCROLL</div>

</div>

</body>
</html>
