<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deniz Cankirli</title>
    <!-- Google Fonts for Ultra Premium Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@200;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* Reset & Core Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            letter-spacing: -0.02em;
        }

        /* Pure Navigation Header - No links, just absolute elite presentation */
        header {
            width: 100%;
            height: 15vh;
            display: block;
            text-align: center;
            padding-top: 5vh;
            background: linear-gradient(to bottom, rgba(5,5,5,1) 0%, rgba(5,5,5,0) 100%);
            position: relative;
            z-index: 10;
        }

        header h1 {
            font-family: 'Cinzel', serif;
            font-weight: 500;
            font-size: 24px;
            letter-spacing: 0.6rem;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
        }

        /* Cinematic Visual Gallery Container */
        .story-container {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
            display: block;
        }

        /* Big Banner Section (Eskişehir / Roots) */
        .hero-banner {
            width: 100%;
            height: 70vh;
            margin-bottom: 30px;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background-image: url('https://images.unsplash.com/photo-1541432901042-2d8bd64b4a9b?auto=format&fit=crop&q=80&w=1800');
            background-size: cover;
            background-position: center;
            cursor: pointer;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Premium Split Image Layout for other elements */
        .image-row {
            width: 100%;
            margin-bottom: 30px;
            display: table;
            table-layout: fixed;
            border-collapse: separate;
            border-spacing: 30px 0;
        }
        
        .image-cell {
            display: table-cell;
            height: 550px;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            cursor: pointer;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Full Width Landscape Block for Nature & Discipline */
        .landscape-block {
            width: 100%;
            height: 500px;
            margin-bottom: 30px;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            cursor: pointer;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Ultra Dark High Contrast Overlay */
        .visual-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.1) 60%, rgba(0,0,0,0) 100%);
            transition: background 0.6s ease;
            display: block;
        }

        /* Hover Dynamics */
        .hero-banner:hover, .image-cell:hover, .landscape-block:hover {
            transform: scale(1.015);
        }

        .hero-banner:hover .visual-overlay, .image-cell:hover .visual-overlay, .landscape-block:hover .visual-overlay {
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.3) 100%);
        }

        /* Minimal Text Alignment */
        .meta-content {
            position: absolute;
            bottom: 40px;
            left: 40px;
            right: 40px;
            z-index: 5;
        }

        .meta-content h2 {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            font-weight: 500;
            letter-spacing: 0.3rem;
            text-transform: uppercase;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .meta-content p {
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 0.4rem;
            text-transform: uppercase;
            color: #888888;
            transition: color 0.4s ease;
        }

        /* Subtle indicator that lights up on hover */
        .hero-banner:hover p, .image-cell:hover p, .landscape-block:hover p {
            color: #ffffff;
        }

        /* Footer Element */
        footer {
            width: 100%;
            padding: 80px 0;
            text-align: center;
            background-color: #030303;
        }

        footer p {
            font-size: 10px;
            letter-spacing: 0.5rem;
            color: #333333;
            text-transform: uppercase;
        }

        /* Absolute Clean Responsive Adjustments for Mobile Viewports */
        @media (max-width: 900px) {
            header h1 { font-size: 18px; letter-spacing: 0.4rem; }
            .image-row { display: block; border-spacing: 0; }
            .image-cell { display: block; width: 100% !important; margin-bottom: 30px; height: 400px; }
            .hero-banner { height: 50vh; }
            .landscape-block { height: 350px; }
            .meta-content { bottom: 25px; left: 25px; }
            .meta-content h2 { font-size: 20px; }
        }
    </style>
</head>
<body>

    <!-- Header Section: Gecentreerde pure typografie zonder afleiding linksboven -->
    <header>
        <h1>Deniz Cankirli</h1>
    </header>

    <!-- Main Visual Grid Area -->
    <main class="story-container">

        <!-- BLOCK 1: Eskişehir (Roots) -->
        <div class="hero-banner">
            <div class="visual-overlay"></div>
            <div class="meta-content">
                <h2>Eskişehir</h2>
                <p>Turkse Afkomst • Roots</p>
            </div>
        </div>

        <!-- ROW 1: Motor & Oceaan (Vrijheid & Diepte) -->
        <div class="image-row">
            <!-- Left Side: Motor -->
            <div class="image-cell" style="background-image: url('https://images.unsplash.com/photo-1558981806-ec527fa84c39?auto=format&fit=crop&q=80&w=1000'); width: 50%;">
                <div class="visual-overlay"></div>
                <div class="meta-content">
                    <h2>Motor</h2>
                    <p>Adrenaline • Snelheid</p>
                </div>
            </div>
            
            <!-- Right Side: Oceaan -->
            <div class="image-cell" style="background-image: url('https://images.unsplash.com/photo-1505118380757-91f5f5632de0?auto=format&fit=crop&q=80&w=1000'); width: 50%;">
                <div class="visual-overlay"></div>
                <div class="meta-content">
                    <h2>Oceaan</h2>
                    <p>Oneindigheid • Rust</p>
                </div>
            </div>
        </div>

        <!-- ROW 2: Vrijheid & Discipline -->
        <div class="image-row">
            <!-- Left Side: Vrijheid -->
            <div class="image-cell" style="background-image: url('https://images.unsplash.com/photo-1483728642387-6c3bdd6c93e5?auto=format&fit=crop&q=80&w=1000'); width: 50%;">
                <div class="visual-overlay"></div>
                <div class="meta-content">
                    <h2>Vrijheid</h2>
                    <p>Geen Grenzen</p>
                </div>
            </div>
            
            <!-- Right Side: Discipline -->
            <div class="image-cell" style="background-image: url('https://images.unsplash.com/photo-1517838277536-f5f99be501cd?auto=format&fit=crop&q=80&w=1000'); width: 50%;">
                <div class="visual-overlay"></div>
                <div class="meta-content">
                    <h2>Discipline</h2>
                    <p>Focus • Kracht</p>
                </div>
            </div>
        </div>

        <!-- BLOCK 2: Natuur -->
        <div class="landscape-block" style="background-image: url('https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?auto=format&fit=crop&q=80&w=1800');">
            <div class="visual-overlay"></div>
            <div class="meta-content">
                <h2>Natuur</h2>
                <p>Puur • Elementair</p>
            </div>
        </div>

    </main>

    <!-- Ultra-luxurious Minimalistic Footer -->
    <footer>
        <p>© 2026 Deniz Cankirli • Designed for the Elite</p>
    </footer>

</body>
</html>
