<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mijn Zee Pagina</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      color: white;

      /* 🌊 Zee achtergrond */
      background: url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=80") 
      no-repeat center center/cover;
    }

    .box {
      text-align: center;
      padding: 40px 60px;
      border-radius: 20px;

      /* glass effect */
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 3rem;
      margin: 0;
      letter-spacing: 2px;
      text-shadow: 2px 2px 10px black;
    }

    p {
      margin-top: 10px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>JOUW NAAM</h1>
    <p>Welkom op mijn GitHub pagina 🌊</p>
  </div>

</body>
</html>
